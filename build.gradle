import org.gradle.internal.os.OperatingSystem

import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def os = OperatingSystem.current()
def osArch = System.getProperty("os.arch").toLowerCase()

switch (os) {
    case OperatingSystem.LINUX:
        project.ext.lwjglNatives = "natives-linux"

        if (osArch.startsWith("arm") || osArch.startsWith("aarch64")) {
            project.ext.lwjglNatives +=
                    (osArch.contains("64") || osArch.startsWith("armv8"))
                            ? "-arm64"
                            : "-arm32"
        } else if (osArch.startsWith("ppc")) {
            project.ext.lwjglNatives += "-ppc64le"
        } else if (osArch.startsWith("riscv")) {
            project.ext.lwjglNatives += "-riscv64"
        }
        break

    case OperatingSystem.MAC_OS:
        project.ext.lwjglNatives = "natives-macos"
        break

    case OperatingSystem.WINDOWS:
        project.ext.lwjglNatives = "natives-windows"
        break

    default:
        throw new GradleException("Unsupported operating system: ${os}")
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }

    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        url "https://maven.blamejared.com"
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/mirror" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
}

dependencies {

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.5")) {
        jarJar.ranged(it, "[0.5.5,)")
    }

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation("com.eliotlash.mclib:mclib:20")

    def lwjglVersion = "3.3.1"

    minecraftLibrary("org.lwjgl:lwjgl-assimp:${lwjglVersion}") {
        exclude group: 'org.lwjgl', module: 'lwjgl'
        exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
        exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
        exclude group: 'org.lwjgl', module: 'lwjgl-stb'
    }

    shadow("org.lwjgl:lwjgl-assimp:${lwjglVersion}") {
        exclude group: 'org.lwjgl', module: 'lwjgl'
        exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
        exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
        exclude group: 'org.lwjgl', module: 'lwjgl-stb'
    }

    runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-macos-arm64"

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'


    //Test Mods

    //Embeddium
    compileOnly fg.deobf("org.embeddedt:embeddium-1.20.1:0.3.31-beta.53+mc1.20.1")

    //Oculus
    compileOnly fg.deobf("maven.modrinth:GchcoXML:iQ1SwGc3")

    implementation fg.deobf("curse.maven:framedblocks-441647:7386520")

    //Create
    boolean runCreate = false

    if (runCreate) {
        implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
        implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
        compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
        runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
        implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
    }
    else {
        compileOnly(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
        compileOnly(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
        compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
        compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
        compileOnly(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
    }

}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    configurations = [project.configurations.shadow]
    dependencies {
        exclude(dependency('org.lwjgl:lwjgl'))
        exclude(dependency('org.lwjgl:lwjgl-glfw'))
        exclude(dependency('org.lwjgl:lwjgl-opengl'))
    }
}

task moveFiles {
    doLast {
        def inputFile = file("$buildDir/libs/" + shadowJar.archiveFileName.get())
        def outputFile = file("$buildDir/libs/" + jar.archiveFileName.get())

        def tempFile = file("$buildDir/libs/" + "output_temp.zip")

        if (inputFile.exists() && outputFile.exists()) {
            def sourceZip = new ZipFile(inputFile)
            def destinationZip = new ZipFile(outputFile)
            def zipOut = new ZipOutputStream(new FileOutputStream(tempFile))

            destinationZip.entries().each { entry ->
                zipOut.putNextEntry(new ZipEntry(entry.getName()))
                zipOut.write(destinationZip.getInputStream(entry).readAllBytes())
                zipOut.closeEntry()
            }

            sourceZip.entries().each { entry ->
                if (destinationZip.getEntry(entry.getName()) == null) {
                    zipOut.putNextEntry(new ZipEntry(entry.getName()))
                    zipOut.write(sourceZip.getInputStream(entry).readAllBytes())
                    zipOut.closeEntry()
                } else {
                    println "File already exists in destination ZIP: ${entry.getName()}. Skipping."
                }
            }

            zipOut.close()
            sourceZip.close()
            destinationZip.close()

            if (outputFile.exists()) {
                outputFile.delete()
            }
            tempFile.renameTo(outputFile)
            inputFile.delete()
        } else {
            println "Input or output ZIP file not found."
        }
    }
}

build {
    dependsOn shadowJar
    finalizedBy moveFiles
}

task extractNativesToResources {
    group = "build"
    description = "Extract native binaries from Gradle dependencies into resources/natives/... for packaging"

    doLast {
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def moduleName = artifact.moduleVersion.id.name
            def classifier = artifact.classifier

            if ((moduleName == "lwjgl-assimp" && classifier?.startsWith("natives")) ||
                    (moduleName.startsWith("imgui-java-natives"))) {

                println "Extracting natives from: ${artifact.file.name}"

                ZipFile zip = new ZipFile(artifact.file)
                zip.entries().each { entry ->
                    if (!entry.isDirectory()) {
                        def fileName = entry.name.substring(entry.name.lastIndexOf('/') + 1)

                        def subdir = null
                        if (fileName.endsWith(".dll")) {
                            subdir = "windows/x86_64"
                        } else if (fileName.endsWith(".so")) {
                            subdir = "linux/x86_64"
                        } else if (fileName.endsWith(".dylib")) {
                            subdir = fileName.contains("arm") ? "osx/arm64" : "osx/x86_64"
                        }

                        if (subdir != null) {
                            def destDir = file("src/main/resources/natives/${subdir}")
                            destDir.mkdirs()

                            def outFile = new File(destDir, fileName)
                            outFile.withOutputStream { osStream ->
                                zip.getInputStream(entry).withStream { it.transferTo(osStream) }
                            }

                            println "Copied $fileName -> $outFile"
                        }
                    }
                }
                zip.close()
            }
        }
    }
}

task bundleAllNativesForDistribution {
    group = "build"
    description = "Bundles Assimp natives into resources/natives"

    doLast {
        def seen = new HashSet<String>()

        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->

            def moduleName = artifact.moduleVersion.id.name
            def group = artifact.moduleVersion.id.group
            def classifier = artifact.classifier

            if (!(group == "org.lwjgl" && moduleName == "lwjgl-assimp" && classifier?.startsWith("natives"))) {
                return
            }

            println "Using Assimp native artifact: ${artifact.file.name}"

            ZipFile zip = new ZipFile(artifact.file)

            zip.entries().each { entry ->
                if (entry.isDirectory()) return

                def fileName = entry.name.substring(entry.name.lastIndexOf('/') + 1)

                if (!(fileName.endsWith(".dll") ||
                        fileName.endsWith(".so") ||
                        fileName.endsWith(".dylib"))) {
                    return
                }

                def key = artifact.file.name + ":" + entry.name
                if (!seen.add(key)) return

                def dir = null

                if (fileName.endsWith(".dll")) {
                    dir = "windows/x86_64"
                } else if (fileName.endsWith(".so")) {
                    dir = "linux/x86_64"
                } else if (fileName.endsWith(".dylib")) {
                    dir = classifier == "natives-macos-arm64"
                            ? "osx/arm64"
                            : "osx/x86_64"
                }

                if (dir == null) return

                def outDir = file("src/main/resources/natives/${dir}")
                outDir.mkdirs()

                def outFile = new File(outDir, fileName)

                outFile.withOutputStream { os2 ->
                    zip.getInputStream(entry).withStream { it.transferTo(os2) }
                }

                println "Bundled ASSIMP ${fileName} -> ${dir}"
            }

            zip.close()
        }
    }
}

compileJava.dependsOn(extractNativesToResources)

processResources.dependsOn(extractNativesToResources)

